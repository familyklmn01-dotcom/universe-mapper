<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" role="img" aria-labelledby="title desc">
  <title id="title">Universe Mapper</title><desc id="desc">A three-dimensional U sphere surrounded by three orbital paths and three planets.</desc>
  <defs>
    <radialGradient id="core" cx="35%" cy="28%" r="75%"><stop offset="0" stop-color="#b9c8ff"/><stop offset=".38" stop-color="#7896ff"/><stop offset="1" stop-color="#4b63d6"/></radialGradient>
    <radialGradient id="blue" cx="35%" cy="30%"><stop stop-color="#a9bdff"/><stop offset="1" stop-color="#5274e8"/></radialGradient><radialGradient id="green" cx="35%" cy="30%"><stop stop-color="#a3f4d8"/><stop offset="1" stop-color="#43bd92"/></radialGradient><radialGradient id="gold" cx="35%" cy="30%"><stop stop-color="#ffe6a0"/><stop offset="1" stop-color="#dda538"/></radialGradient>
    <linearGradient id="orbit"><stop stop-color="#8ba3ff" stop-opacity=".18"/><stop offset=".45" stop-color="#6687fa" stop-opacity=".72"/><stop offset="1" stop-color="#a6b7ff" stop-opacity=".12"/></linearGradient>
    <filter id="depth" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#050814" flood-opacity=".65"/><feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#8ca6ff" flood-opacity=".25"/></filter><filter id="dot" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#02040b" flood-opacity=".7"/></filter>
  </defs>
  <ellipse cx="90" cy="60" rx="73" ry="31" fill="none" stroke="url(#orbit)" stroke-width="1.4" transform="rotate(-19 90 60)"/><ellipse cx="90" cy="60" rx="57" ry="43" fill="none" stroke="url(#orbit)" stroke-width="1.15" transform="rotate(25 90 60)"/><ellipse cx="90" cy="60" rx="77" ry="20" fill="none" stroke="url(#orbit)" stroke-width=".8" stroke-dasharray="2 4" transform="rotate(8 90 60)" opacity=".55"/>
  <circle cx="90" cy="60" r="24" fill="url(#core)" filter="url(#depth)"/><circle cx="84" cy="53" r="7" fill="#fff" opacity=".1"/><text x="90" y="68" text-anchor="middle" fill="#fff" font-size="25" font-family="Inter,Segoe UI,sans-serif" font-weight="800">U</text>
  <circle cx="22" cy="43" r="6" fill="url(#blue)" filter="url(#dot)"/><circle cx="158" cy="50" r="5" fill="url(#green)" filter="url(#dot)"/><circle cx="106" cy="106" r="4.5" fill="url(#gold)" filter="url(#dot)"/>
</svg>
